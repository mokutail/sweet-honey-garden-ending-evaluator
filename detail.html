<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『箱庭に注がれた甘美な蜜』 エンド判定ツール</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 入力欄のシンプルなデザイン */
        .name-input-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .name-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .name-field input {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }
        /* 確定ボタンの演出 */
        .action-area {
            text-align: center;
            margin: 30px 0;
        }
        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .submit-btn:hover {
            background-color: #34495e;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        /* 結末描写エリア（初期状態は非表示） */
        .story-area {
            display: none;
            background: #ffffff;
            border-radius: 8px;
            padding: 25px;
            margin-top: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .story-text {
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.8;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>『箱庭に注がれた甘美な蜜』 エンド判定ツール</h1>
        <p class="subtitle">セッションの最終的な着地点を選択してください</p>
    </header>

    <div class="section">
        <h2>探索者名（PC名）の登録</h2>
        <div class="name-input-grid">
            <div class="name-field">
                <label><strong>HO1（ルーク）の名前</strong></label>
                <input type="text" id="name_ho1" value="">
            </div>
            <div class="name-field">
                <label><strong>HO2（ナイト）の名前</strong></label>
                <input type="text" id="name_ho2" value="">
            </div>
            <div class="name-field">
                <label><strong>HO3（ビショップ）の名前</strong></label>
                <input type="text" id="name_ho3" value="">
            </div>
            <div class="name-field">
                <label><strong>HO4（キング）の名前</strong></label>
                <input type="text" id="name_ho4" value="">
            </div>
        </div>
    </div>

    <div class="section">
        <h2>1. 連続猟奇殺人事件の結着（全体の結末）</h2>
        <div class="radio-group">
            <label>
                <input type="radio" name="case_end" value="ho3_arrest" checked>
                <div>
                    <strong>HO3の身柄拘束（逮捕・告発）</strong>
                    <span class="description">真犯人がHO3であることを見抜き、司法（あるいは特捜班）の手で彼を現行犯逮捕、または拘束した。</span>
                </div>
            </label>
            <label>
                <input type="radio" name="case_end" value="ho3_kill">
                <div>
                    <strong>HO3の抹殺（私刑・戦闘不服）</strong>
                    <span class="description">HO3の正体を見抜いた上でその手で射殺した、あるいは戦闘によってHO3を死亡させて決着とした。</span>
                </div>
            </label>
            <label>
                <input type="radio" name="case_end" value="scapegoat_end">
                <div>
                    <strong>冤罪の幕引き（工作の完遂）</strong>
                    <span class="description">HO3の工作に騙され、あるいは自白により、無実のメンバー（HO2など）を真犯人として処理・連行した。</span>
                </div>
            </label>
            <label>
                <input type="radio" name="case_end" value="bury_end">
                <div>
                    <strong>事件の隠蔽（闇への埋没）</strong>
                    <span class="description">真相を知った上で、愛憎や絶望から事件のすべてを公にせず闇に葬ることを選択した。</span>
                </div>
            </label>
        </div>
    </div>

    <div class="section">
        <h2>2. HO1（ルーク）の最終ステータス</h2>
        <div class="radio-group">
            <label>
                <input type="radio" name="ho1_status" value="alive_justice" checked>
                <div>
                    <strong>正義の執行</strong>
                    <span class="description">生存。憎しみを堪えて正義を貫いた、あるいは真犯人を見誤ったまま生き残った。</span>
                </div>
            </label>
            <label>
                <input type="radio" name="ho1_status" value="alive_revenge">
                <div>
                    <strong>復讐の完遂</strong>
                    <span class="description">生存。自らの憎悪のままに、引き金を引いて復讐（または私刑による殺害）を果たした。</span>
                </div>
            </label>
            <label>
                <input type="radio" name="ho1_status" value="alive_obsess">
                <div>
                    <strong>執着と狂気</strong>
                    <span class="description">生存。愛憎の果てに真犯人（HO3）を自分の手元に隠匿・監禁することを選んだ。</span>
                </div>
            </label>
            <label>
                <input type="radio" name="ho1_status" value="dead">
                <div>
                    <strong>ロスト</strong>
                    <span class="description">決断を下す前に、地下での戦闘やPC間の銃撃戦によって死亡・ロストした。</span>
                </div>
            </label>
        </div>
    </div>

    <div class="section">
        <h2>3. HO2（ナイト）の最終ステータス</h2>
        <div class="radio-group">
            <label>
                <input type="radio" name="ho2_status" value="confess" checked>
                <div>
                    <strong>生存：過去の自白</strong>
                    <span class="description">生存。7年前に結色の遺体を遺棄した罪を自白し、裁きを受け入れる覚悟を決めた。</span>
                </div>
            </label>
            <label>
                <input type="radio" name="ho2_status" value="blind">
                <div>
                    <strong>生存：隠蔽の継続</strong>
                    <span class="description">生存。自分の過去の罪（遺体遺棄）も、誰にもバレずに隠し通したまま生還した。</span>
                </div>
            </label>
            <label>
                <input type="radio" name="ho2_status" value="dead">
                <div>
                    <strong>ロスト（死亡）</strong>
                    <span class="description">決断を下す前に、地下での戦闘やPC間の銃撃戦によって死亡・ロストした。</span>
                </div>
            </label>
        </div>
    </div>

    <div class="section">
        <h2>4. HO3（ビショップ）の最終ステータス</h2>
        <div class="radio-group">
            <label>
                <input type="radio" name="ho3_status" value="arrest" checked>
                <div>
                    <strong>身柄拘束 / 監禁</strong>
                    <span class="description">生存。特捜班や警察組織に身柄を拘束されている、あるいは誰かの檻に閉じ込められている。</span>
                </div>
            </label>
            <label>
                <input type="radio" name="ho3_status" value="win">
                <div>
                    <strong>逃亡 / 一人勝ち</strong>
                    <span class="description">生存。他のメンバーを全員殺害・無力化、あるいは完全に欺いて何食わぬ顔で逃げ切った。</span>
                </div>
            </label>
            <label>
                <input type="radio" name="ho3_status" value="dead">
                <div>
                    <strong>ロスト（死亡）</strong>
                    <span class="description">戦闘で死亡した、またはPCたちに直接殺害されて冷たい骸となった。</span>
                </div>
            </label>
        </div>
    </div>

    <div class="section">
        <h2>5. HO4（キング）の最終選択</h2>
        <div class="radio-group">
            <label>
                <input type="radio" name="ho4_choice" value="return" checked>
                <div>
                    <strong>通常生還</strong>
                    <span class="description">[HO2]を飼育せず、そのまま地上へ帰還した。（証拠の有無で実父への反逆か現状維持へ自動分岐）</span>
                </div>
            </label>
            <label>
                <input type="radio" name="ho4_choice" value="tame_ho2">
                <div>
                    <strong>[HO2]の飼育・支配</strong>
                    <span class="description">[HO2]の過去の罪（遺体遺棄）を握り、彼を自分の新たな「忠実な道具（飼い犬）」として手元に置いて管理することを選んだ。</span>
                </div>
            </label>
            <label>
                <input type="radio" name="ho4_choice" value="dead">
                <div>
                    <strong>ロスト（死亡）</strong>
                    <span class="description">決断を下す前に、地下での激しい死闘やPC間の対立によって死亡・ロストした。</span>
                </div>
            </label>
        </div>
    </div>
    
    <div class="section">
        <h2>6. クライマックスの戦況・システムフラグ</h2>
        <div class="checkbox-group">
            <label>
                <input type="checkbox" id="status_myth" checked>
                <div>
                    <strong>[神話生物の撃破]</strong>
                    <span class="description">『アブホースの落とし子』のHPを0以下にして撃破した。</span>
                </div>
            </label>
            <label>
                <input type="checkbox" id="status_evidence" checked>
                <div>
                    <strong>[証拠の地上持ち帰り]</strong>
                    <span class="description">結色の死蝋（胃袋）からSDカードを回収し、地上へ生還した。</span>
                </div>
            </label>
        </div>
    </div>

    <div id="resultBox" class="result-area">
        <div class="result-title">現在の条件による確定ルート</div>
        <div id="resultName" class="result-name">計算中...</div>
    </div>

    <div class="action-area">
        <button type="button" class="submit-btn" onclick="generateStoryEnding()">END描写へ</button>
    </div>

    <div id="storyArea" class="story-area">
        <h2 style="border-left: 4px solid var(--primary-color); padding-left: 10px; margin-top:0;">📖 終局の物語（エンディング描写）</h2>
        <div id="storyOutput" class="story-text"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
